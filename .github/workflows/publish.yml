name: Publish

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to publish (comma-separated)"
        required: true
        default: "create-signal,create-throttle,create-pool,create-scope,create-input"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Authenticate Wally
        run: |
          mkdir -p ~/.wally
          printf '[tokens]\n"https://github.com/UpliftGames/wally-index" = "%s"\n' "${{ secrets.WALLY_TOKEN }}" > ~/.wally/auth.toml
      - name: Publish packages
        run: |
          IFS=',' read -ra PKGS <<< "${{ inputs.packages }}"
          for pkg in "${PKGS[@]}"; do
            pkg=$(echo "$pkg" | xargs)
            echo "Publishing $pkg..."
            cd "lib/$pkg"
            wally publish
            cd ../..
          done